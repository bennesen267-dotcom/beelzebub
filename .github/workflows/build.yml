name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle build
        working-directory: hvh-client
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: |
            hvh-client/build/libs/*.jar
            !hvh-client/build/libs/*-sources.jar
